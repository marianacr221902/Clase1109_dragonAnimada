<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Feng Huang AR</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
</head>
<body>
 
<a-scene
  webxr="optionalFeatures: hit-test, local-floor, dom-overlay"
  xr-mode-ui="XRMode: ar">
<a-assets timeout="10000">
<a-asset-item id="jurassic_world_dominion_raptormsfs2024orbx" src="jurassic_world_dominion_raptormsfs2024orbx.glb"></a-asset-item>
</a-assets>
 
  <a-entity
gltf-model="#jurassic_world_dominion_raptormsfs2024orbx"
animation-mixer="clip: *; loop: repeat"
animation__giro="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear"
animation__flotar="property: position; from: 0 1.5 -4; to: 0 2.2 -4; dir: alternate; loop: 
true; dur: 3000; easing: easeInOutSine"
scale="1 1 1">
</a-entity>

 
  <a-light type="ambient" intensity="0.9"></a-light>
<a-light type="directional" intensity="0.6" position="1 3 2"></a-light>
</a-scene>
</body>
</html>
